<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNS Post JSON Analyzer</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-slate-900 text-white rounded-lg">
          <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 leading-tight">SNS Post JSON Analyzer</h1>
          <p class="text-xs text-slate-500">投稿データ分析・10バズ集計ツール</p>
        </div>
      </div>
      <button id="demoBtn" onclick="loadDemoData()" class="text-xs font-medium text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded transition">
        サンプルデータを読み込む
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 space-y-6">

    <!-- Upload Area -->
    <div id="dropZone" class="bg-white border-2 border-dashed border-slate-300 hover:border-slate-400 rounded-xl p-6 text-center transition cursor-pointer shadow-sm">
      <input type="file" id="fileInput" accept=".json" class="hidden">
      <div class="flex flex-col items-center gap-2">
        <div class="p-3 bg-slate-100 text-slate-600 rounded-full">
          <i data-lucide="upload-cloud" class="w-6 h-6"></i>
        </div>
        <div>
          <p class="text-sm font-semibold text-slate-700">JSONファイルをドラッグ＆ドロップ</p>
          <p class="text-xs text-slate-400 mt-1">またはクリックしてファイルを選択</p>
        </div>
      </div>
    </div>

    <!-- Dashboard Metrics (5 Grid Cards) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
      <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-500 mb-1">
          <span class="text-xs font-medium text-slate-500">総ポスト数</span>
          <i data-lucide="file-text" class="w-4 h-4 text-slate-400"></i>
        </div>
        <div class="flex items-baseline justify-between">
          <span id="statPostCount" class="text-2xl font-bold text-slate-900 tracking-tight">0</span>
          <span class="text-xs text-slate-400">件</span>
        </div>
      </div>

      <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm flex flex-col justify-between border-l-4 border-l-amber-500">
        <div class="flex items-center justify-between text-slate-500 mb-1">
          <span class="text-xs font-semibold text-amber-700">10バズ獲得数 (10+いいね)</span>
          <i data-lucide="zap" class="w-4 h-4 text-amber-500"></i>
        </div>
        <div class="flex items-baseline justify-between">
          <span id="statTenBuzzCount" class="text-2xl font-bold text-amber-600 tracking-tight">0</span>
          <span id="statTenBuzzRate" class="text-xs font-medium text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded">0%</span>
        </div>
      </div>

      <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-500 mb-1">
          <span class="text-xs font-medium text-slate-500">総いいね数</span>
          <i data-lucide="heart" class="w-4 h-4 text-slate-400"></i>
        </div>
        <div class="flex items-baseline justify-between">
          <span id="statTotalLikes" class="text-2xl font-bold text-slate-900 tracking-tight">0</span>
          <span class="text-xs text-slate-400">いいね</span>
        </div>
      </div>

      <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-500 mb-1">
          <span class="text-xs font-medium text-slate-500">平均いいね数</span>
          <i data-lucide="trending-up" class="w-4 h-4 text-slate-400"></i>
        </div>
        <div class="flex items-baseline justify-between">
          <span id="statAvgLikes" class="text-2xl font-bold text-slate-900 tracking-tight">0</span>
          <span class="text-xs text-slate-400">/ Post</span>
        </div>
      </div>

      <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-500 mb-1">
          <span class="text-xs font-medium text-slate-500">リポスト / 返信 合計</span>
          <i data-lucide="repeat" class="w-4 h-4 text-slate-400"></i>
        </div>
        <div class="flex items-baseline justify-between">
          <span class="text-2xl font-bold text-slate-900 tracking-tight"><span id="statTotalRetweets">0</span> <span class="text-sm font-normal text-slate-400">/</span> <span id="statTotalReplies">0</span></span>
          <span class="text-xs text-slate-400">(RP / 返信)</span>
        </div>
      </div>
    </div>

    <!-- Charts Section -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4">いいね数・リポスト数（上位20件）</h3>
        <div class="h-64 relative">
          <canvas id="postsChart"></canvas>
        </div>
      </div>
      <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4">投稿時間帯（アクティビティ）</h3>
        <div class="h-64 relative">
          <canvas id="timeChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Controls & Search -->
    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="relative w-full sm:w-80">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="searchInput" placeholder="本文を検索..." class="w-full pl-9 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded focus:outline-none focus:ring-1 focus:ring-slate-400 text-slate-800">
      </div>
      
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <select id="sortSelect" class="py-1.5 px-3 text-xs bg-white border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-slate-500 text-slate-700 w-full sm:w-auto">
          <option value="likes_desc" selected>いいね数（多い順）</option>
          <option value="ten_buzz_only">⚡ 10バズ（10いいね以上のみ）</option>
          <option value="likes_asc">いいね数（少ない順）</option>
          <option value="date_desc">投稿日時（新しい順）</option>
          <option value="date_asc">投稿日時（古い順）</option>
          <option value="retweets_desc">リポスト数（多い順）</option>
          <option value="length_desc">文字数（多い順）</option>
        </select>
        <button id="exportCsvBtn" onclick="exportCSV()" class="flex items-center gap-1 py-1.5 px-3 text-xs bg-slate-800 hover:bg-slate-900 text-white font-medium rounded transition whitespace-nowrap">
          <i data-lucide="download" class="w-3.5 h-3.5"></i> CSV
        </button>
      </div>
    </div>

    <!-- Table Section -->
    <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-600">
          <thead class="bg-slate-50 border-b border-slate-200 font-semibold text-slate-700">
            <tr>
              <th class="py-3 px-4 min-w-[300px]">投稿本文</th>
              <th class="py-3 px-4 whitespace-nowrap">投稿日時</th>
              <th class="py-3 px-4 text-center whitespace-nowrap">いいね</th>
              <th class="py-3 px-4 text-center whitespace-nowrap">リポスト</th>
              <th class="py-3 px-4 text-center whitespace-nowrap">返信</th>
              <th class="py-3 px-4 text-center whitespace-nowrap">文字数</th>
            </tr>
          </thead>
          <tbody id="postsTableBody" class="divide-y divide-slate-100">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
      <!-- Pagination Controls -->
      <div class="p-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs text-slate-500">
        <span id="pageInfo">0 件を表示</span>
        <div class="flex gap-1">
          <button id="prevPageBtn" onclick="changePage(-1)" class="px-2.5 py-1 bg-white border border-slate-300 rounded disabled:opacity-40 font-medium">前へ</button>
          <button id="nextPageBtn" onclick="changePage(1)" class="px-2.5 py-1 bg-white border border-slate-300 rounded disabled:opacity-40 font-medium">次へ</button>
        </div>
      </div>
    </div>

  </main>

  <script>
    let rawPosts = [];
    let analyzedPosts = [];
    let filteredPosts = [];

    let currentPage = 1;
    const pageSize = 15;

    let postsChartObj = null;
    let timeChartObj = null;

    // UI Elements
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const postsTableBody = document.getElementById('postsTableBody');

    // Event Listeners
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-slate-500', 'bg-slate-50');
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('border-slate-500', 'bg-slate-50');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-slate-500', 'bg-slate-50');
      if (e.dataTransfer.files.length) {
        handleFile(e.dataTransfer.files[0]);
      }
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        handleFile(e.target.files[0]);
      }
    });

    searchInput.addEventListener('input', () => applyFiltersAndSort());
    sortSelect.addEventListener('change', () => applyFiltersAndSort());

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const json = JSON.parse(e.target.result);
          processJSONData(json);
        } catch (err) {
          alert('JSONファイルの読み込みに失敗しました。正しいJSON構文か確認してください。');
        }
      };
      reader.readAsText(file);
    }

    function processJSONData(data) {
      let list = Array.isArray(data) ? data : (data.posts || []);
      
      rawPosts = list;
      analyzedPosts = list.map(item => ({
        id: item.id || '',
        text: item.text || '',
        createdAt: item.createdAt ? new Date(item.createdAt) : null,
        likeCount: Number(item.likeCount || 0),
        retweetCount: Number(item.retweetCount || 0),
        replyCount: Number(item.replyCount || 0),
        length: (item.text || '').length
      }));

      updateStats();
      renderCharts();
      applyFiltersAndSort();
    }

    // Update Dashboard Metrics
    function updateStats() {
      const count = analyzedPosts.length;
      if (count === 0) {
        document.getElementById('statPostCount').textContent = '0';
        document.getElementById('statTenBuzzCount').textContent = '0';
        document.getElementById('statTenBuzzRate').textContent = '0%';
        document.getElementById('statTotalLikes').textContent = '0';
        document.getElementById('statAvgLikes').textContent = '0';
        document.getElementById('statTotalRetweets').textContent = '0';
        document.getElementById('statTotalReplies').textContent = '0';
        return;
      }

      const totalLikes = analyzedPosts.reduce((acc, p) => acc + p.likeCount, 0);
      const totalRetweets = analyzedPosts.reduce((acc, p) => acc + p.retweetCount, 0);
      const totalReplies = analyzedPosts.reduce((acc, p) => acc + p.replyCount, 0);
      
      const tenBuzzPosts = analyzedPosts.filter(p => p.likeCount >= 10);
      const tenBuzzCount = tenBuzzPosts.length;
      const tenBuzzRate = ((tenBuzzCount / count) * 100).toFixed(1);

      const avgLikes = (totalLikes / count).toFixed(1);

      document.getElementById('statPostCount').textContent = count.toLocaleString();
      document.getElementById('statTenBuzzCount').textContent = tenBuzzCount.toLocaleString();
      document.getElementById('statTenBuzzRate').textContent = `${tenBuzzRate}%`;
      document.getElementById('statTotalLikes').textContent = totalLikes.toLocaleString();
      document.getElementById('statAvgLikes').textContent = avgLikes;
      document.getElementById('statTotalRetweets').textContent = totalRetweets.toLocaleString();
      document.getElementById('statTotalReplies').textContent = totalReplies.toLocaleString();
    }

    // Render Chart.js
    function renderCharts() {
      if (postsChartObj) postsChartObj.destroy();
      if (timeChartObj) timeChartObj.destroy();

      const topPosts = [...analyzedPosts].sort((a, b) => b.likeCount - a.likeCount).slice(0, 20);

      const ctx1 = document.getElementById('postsChart').getContext('2d');
      postsChartObj = new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: topPosts.map((p, i) => `#${i + 1} (${p.length}字)`),
          datasets: [
            {
              label: 'いいね数',
              data: topPosts.map(p => p.likeCount),
              backgroundColor: '#f59e0b',
              borderRadius: 4
            },
            {
              label: 'リポスト数',
              data: topPosts.map(p => p.retweetCount),
              backgroundColor: '#64748b',
              borderRadius: 4
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } }
          },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 } } },
            y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } }
          }
        }
      });

      // Time Distribution Chart
      const hours = Array(24).fill(0);
      analyzedPosts.forEach(p => {
        if (p.createdAt) {
          hours[p.createdAt.getHours()]++;
        }
      });

      const ctx2 = document.getElementById('timeChart').getContext('2d');
      timeChartObj = new Chart(ctx2, {
        type: 'line',
        data: {
          labels: Array.from({length: 24}, (_, i) => `${i}時`),
          datasets: [{
            label: '投稿数',
            data: hours,
            borderColor: '#334155',
            backgroundColor: 'rgba(51, 65, 85, 0.05)',
            fill: true,
            tension: 0.3,
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 9 } } },
            y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 }, stepSize: 1 } }
          }
        }
      });
    }

    // Apply Filter and Sort
    function applyFiltersAndSort() {
      const query = searchInput.value.toLowerCase().trim();
      const sortVal = sortSelect.value;

      filteredPosts = analyzedPosts.filter(p => {
        const matchesQuery = !query || p.text.toLowerCase().includes(query);
        if (sortVal === 'ten_buzz_only') {
          return matchesQuery && p.likeCount >= 10;
        }
        return matchesQuery;
      });

      filteredPosts.sort((a, b) => {
        switch (sortVal) {
          case 'likes_desc':
          case 'ten_buzz_only': return b.likeCount - a.likeCount;
          case 'likes_asc': return a.likeCount - b.likeCount;
          case 'date_desc': return (b.createdAt || 0) - (a.createdAt || 0);
          case 'date_asc': return (a.createdAt || 0) - (b.createdAt || 0);
          case 'retweets_desc': return b.retweetCount - a.retweetCount;
          case 'length_desc': return b.length - a.length;
          default: return 0;
        }
      });

      currentPage = 1;
      renderTable();
    }

    // Render Table
    function renderTable() {
      postsTableBody.innerHTML = '';

      if (filteredPosts.length === 0) {
        postsTableBody.innerHTML = `
          <tr>
            <td colspan="6" class="py-12 text-center text-slate-400">
              該当するポストが見つかりません
            </td>
          </tr>
        `;
        document.getElementById('pageInfo').textContent = '0 件中 0 - 0 件を表示';
        document.getElementById('prevPageBtn').disabled = true;
        document.getElementById('nextPageBtn').disabled = true;
        return;
      }

      const startIndex = (currentPage - 1) * pageSize;
      const endIndex = Math.min(startIndex + pageSize, filteredPosts.length);
      const pageData = filteredPosts.slice(startIndex, endIndex);

      pageData.forEach(post => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition-colors';

        const isTenBuzz = post.likeCount >= 10;
        const likeBadgeHtml = isTenBuzz 
          ? `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 text-[10px] font-bold text-amber-700 bg-amber-100 rounded border border-amber-300 ml-2 shrink-0">⚡10バズ</span>`
          : '';

        tr.innerHTML = `
          <td class="py-3 px-4 text-slate-900 whitespace-pre-wrap leading-relaxed">
            <div class="flex items-start justify-between gap-2">
              <span>${escapeHtml(post.text)}</span>
              ${likeBadgeHtml}
            </div>
          </td>
          <td class="py-3 px-4 text-slate-500 whitespace-nowrap">${post.createdAt ? formatDate(post.createdAt) : '-'}</td>
          <td class="py-3 px-4 text-center font-semibold ${isTenBuzz ? 'text-amber-600 font-bold' : 'text-slate-800'} whitespace-nowrap">${post.likeCount.toLocaleString()}</td>
          <td class="py-3 px-4 text-center text-slate-600 whitespace-nowrap">${post.retweetCount.toLocaleString()}</td>
          <td class="py-3 px-4 text-center text-slate-600 whitespace-nowrap">${post.replyCount.toLocaleString()}</td>
          <td class="py-3 px-4 text-center text-slate-400 whitespace-nowrap">${post.length}</td>
        `;

        postsTableBody.appendChild(tr);
      });

      document.getElementById('pageInfo').textContent = `${filteredPosts.length.toLocaleString()} 件中 ${startIndex + 1} - ${endIndex} 件を表示`;
      document.getElementById('prevPageBtn').disabled = currentPage === 1;
      document.getElementById('nextPageBtn').disabled = endIndex >= filteredPosts.length;
    }

    function changePage(delta) {
      currentPage += delta;
      renderTable();
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hour = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${year}/${month}/${day} ${hour}:${min}`;
    }

    function exportCSV() {
      if (filteredPosts.length === 0) {
        alert('出力対象のデータがありません');
        return;
      }

      let csvContent = 'ID,本文,投稿日時,いいね数,リポスト数,返信数,文字数,10バズフラグ\n';
      filteredPosts.forEach(p => {
        const text = `"${p.text.replace(/"/g, '""')}"`;
        const dateStr = p.createdAt ? formatDate(p.createdAt) : '';
        const isTenBuzz = p.likeCount >= 10 ? 'TRUE' : 'FALSE';
        csvContent += `${p.id},${text},${dateStr},${p.likeCount},${p.retweetCount},${p.replyCount},${p.length},${isTenBuzz}\n`;
      });

      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `post_analytics_${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
    }

    // Sample Demo Loader
    function loadDemoData() {
      const demoData = [
        {
          "id": "2091167642902595212",
          "text": "リアルどころか𝕏でも嫌われる伝説の人の逃げ場をやっと見つけられた\n\n編集できるの神かよ",
          "createdAt": "2026-08-22T14:16:32.739Z",
          "likeCount": 12,
          "retweetCount": 3,
          "replyCount": 1
        },
        {
          "id": "2091169290332931819",
          "text": "らららーん♪",
          "createdAt": "2026-08-22T14:23:05.517Z",
          "likeCount": 2,
          "retweetCount": 0,
          "replyCount": 0
        },
        {
          "id": "2091170920096859946",
          "text": "ヴィヴォオオオオオオオオオオオオオオ",
          "createdAt": "2026-08-22T14:29:34.083Z",
          "likeCount": 1,
          "retweetCount": 0,
          "replyCount": 0
        },
        {
          "id": "2091171823533164338",
          "text": "認証済みマークの反対に嫌われ済みマーク(？)みたいなのないのかな",
          "createdAt": "2026-08-22T14:33:09.478Z",
          "likeCount": 15,
          "retweetCount": 5,
          "replyCount": 2
        },
        {
          "id": "2091172823533164399",
          "text": "少人数SNSでの10いいねは実質トレンド入り並の偉業",
          "createdAt": "2026-08-22T15:10:00.000Z",
          "likeCount": 10,
          "retweetCount": 2,
          "replyCount": 1
        }
      ];
      processJSONData(demoData);
    }

    // Load sample automatically on boot
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadDemoData();
    });
  </script>
</body>
</html>
