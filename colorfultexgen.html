<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字色タグメーカー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    
    /* 入力フォーム等のフォーカスリング調整 */
    input:focus, textarea:focus, button:focus-visible {
      outline: 2px solid #18181b;
      outline-offset: -1px;
    }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-900 min-h-screen antialiased flex flex-col justify-between">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-zinc-300">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="font-bold text-sm text-zinc-900 tracking-tight flex items-center gap-2">
        <span class="w-2.5 h-2.5 bg-zinc-900 inline-block"></span>
        文字色タグメーカー
      </h1>
      <span class="text-xs text-zinc-600 font-mono">&lt;色="…"&gt; 一括変換</span>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-1 space-y-4">

    <!-- 入力領域 -->
    <section class="bg-white border border-zinc-300 p-4 space-y-2">
      <div class="flex items-center justify-between text-xs">
        <label for="inputText" class="font-bold text-zinc-700">入力テキスト</label>
        <div class="flex items-center gap-3">
          <button id="clearInputBtn" class="text-zinc-600 hover:text-zinc-900 underline">クリア</button>
          <span id="charCountBadge" class="font-mono text-zinc-600">0 文字</span>
        </div>
      </div>
      <textarea
        id="inputText"
        rows="3"
        placeholder="テキストを入力してください"
        class="w-full bg-zinc-50 border border-zinc-300 rounded-sm p-3 text-sm text-zinc-900 placeholder-zinc-400 focus:bg-white resize-y transition-colors"
      ></textarea>
    </section>

    <!-- パレット ＆ 設定 -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
      
      <!-- プリセット選択 (7カラム) -->
      <section class="md:col-span-7 bg-white border border-zinc-300 p-4 space-y-3">
        <div class="text-xs font-bold text-zinc-700">カラープリセット</div>

        <div id="presetsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
          <!-- JS生成 -->
        </div>

        <!-- カスタムカラー領域 -->
        <div id="customColorPickerWrap" class="pt-3 border-t border-zinc-200 space-y-2 hidden">
          <div class="flex items-center justify-between text-xs">
            <span class="text-zinc-600">指定色（最大6色）:</span>
            <button id="addCustomColorBtn" class="text-zinc-900 font-bold hover:underline">+ 色を追加</button>
          </div>
          <div id="customColorInputs" class="flex flex-wrap gap-1.5">
            <!-- JS動的追加 -->
          </div>
        </div>
      </section>

      <!-- 設定項目 (5カラム) -->
      <section class="md:col-span-5 bg-white border border-zinc-300 p-4 space-y-3 flex flex-col justify-between">
        <div class="space-y-3">
          <div class="text-xs font-bold text-zinc-700">タグ変換設定</div>

          <!-- 色変更単位 -->
          <div class="space-y-1">
            <div class="flex justify-between text-xs text-zinc-600">
              <span>単位</span>
              <span id="chunkDisplayBadge" class="font-mono text-zinc-900 font-bold">1文字</span>
            </div>
            <div class="grid grid-cols-4 gap-1 text-xs">
              <button type="button" data-chunk-val="1" class="chunk-btn py-1 border border-zinc-900 bg-zinc-900 text-white font-mono">1文字</button>
              <button type="button" data-chunk-val="2" class="chunk-btn py-1 border border-zinc-300 bg-white text-zinc-700 hover:bg-zinc-50 font-mono">2文字</button>
              <button type="button" data-chunk-val="3" class="chunk-btn py-1 border border-zinc-300 bg-white text-zinc-700 hover:bg-zinc-50 font-mono">3文字</button>
              <button type="button" data-chunk-val="custom" class="chunk-btn py-1 border border-zinc-300 bg-white text-zinc-700 hover:bg-zinc-50 font-mono">指定</button>
            </div>
            <div id="customChunkWrap" class="hidden items-center gap-2 pt-1">
              <input type="range" id="chunkSlider" min="1" max="10" value="1" class="w-full accent-zinc-900 h-1 bg-zinc-200 cursor-pointer">
              <span id="sliderValueText" class="text-xs font-mono text-zinc-700 w-8 text-right">1</span>
            </div>
          </div>

          <!-- カラーコード形式 -->
          <div class="space-y-1 pt-2 border-t border-zinc-100">
            <span class="text-xs text-zinc-600 block">コード形式</span>
            <div class="grid grid-cols-2 gap-1 text-xs font-mono">
              <button type="button" data-hex-mode="hash" class="hex-mode-btn py-1 border border-zinc-900 bg-zinc-900 text-white">#FF0000</button>
              <button type="button" data-hex-mode="plain" class="hex-mode-btn py-1 border border-zinc-300 bg-white text-zinc-700 hover:bg-zinc-50">FF0000</button>
            </div>
          </div>

          <!-- チェックボックス -->
          <div class="space-y-1.5 pt-2 border-t border-zinc-100 text-xs">
            <label class="flex items-center gap-2 cursor-pointer text-zinc-700">
              <input type="checkbox" id="skipSpacesCheck" class="accent-zinc-900" checked>
              <span>空白にはタグを付けない</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-zinc-700">
              <input type="checkbox" id="skipNewlinesCheck" class="accent-zinc-900" checked>
              <span>改行にはタグを付けない</span>
            </label>
          </div>
        </div>

        <!-- タグ名設定 -->
        <div class="pt-2 border-t border-zinc-100 text-xs space-y-1">
          <label class="text-zinc-600 block">使用タグ名</label>
          <div class="flex items-center gap-1">
            <span class="font-mono text-zinc-600">&lt;</span>
            <input type="text" id="customTagName" value="色" class="w-full bg-zinc-50 border border-zinc-300 rounded-sm px-2 py-0.5 text-xs text-zinc-900 font-mono">
            <span class="font-mono text-zinc-600">="…"&gt;</span>
          </div>
        </div>
      </section>
    </div>

    <!-- プレビュー -->
    <section class="bg-white border border-zinc-300 p-4 space-y-2">
      <div class="text-xs font-bold text-zinc-700">プレビュー</div>
      <div id="previewBox" class="min-h-[60px] max-h-[140px] overflow-y-auto bg-zinc-900 rounded-sm p-3 text-base sm:text-lg font-medium leading-relaxed break-words whitespace-pre-wrap text-white">
        <!-- JS描画 -->
      </div>
    </section>

    <!-- 結果出力 -->
    <section class="bg-white border border-zinc-300 p-4 space-y-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-xs font-bold text-zinc-700">生成結果</span>
          <span id="outputLengthBadge" class="text-xs font-mono text-zinc-500">0 文字</span>
        </div>
        <button id="copyBtn" class="bg-zinc-900 hover:bg-zinc-800 active:bg-black text-white text-xs font-bold px-3 py-1.5 rounded-sm transition">
          コードをコピー
        </button>
      </div>

      <textarea
        id="outputText"
        rows="4"
        readonly
        class="w-full bg-zinc-50 border border-zinc-300 rounded-sm p-3 text-xs font-mono text-zinc-800 focus:bg-white select-all leading-relaxed"
        placeholder="ここに生成結果が出力されます"
      ></textarea>
    </section>

  </main>

  <footer class="text-center py-4 text-[11px] text-zinc-600 border-t border-zinc-200 bg-white">
    文字色タグメーカー
  </footer>

  <!-- トースト表示 -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 bg-zinc-900 text-white px-3 py-2 rounded-sm text-xs font-mono opacity-0 transition-opacity pointer-events-none">
    コピーしました
  </div>

  <script>
    const PRESETS = [
      { id: 'rainbow', name: 'レインボー', colors: ['#EF4444', '#F59E0B', '#10B981', '#06B6D4', '#6366F1', '#EC4899'], type: 'gradient' },
      { id: 'sunset', name: 'サンセット', colors: ['#F43F5E', '#FB923C', '#FACC15', '#A855F7'], type: 'gradient' },
      { id: 'neon', name: 'ネオン', colors: ['#FF007F', '#7928CA', '#00F0FF'], type: 'gradient' },
      { id: 'pastel', name: 'パステル', colors: ['#FCA5A5', '#FDE047', '#86EFAC', '#93C5FD', '#F472B6'], type: 'gradient' },
      { id: 'ocean', name: 'オーシャン', colors: ['#38BDF8', '#818CF8', '#1E3A8A'], type: 'gradient' },
      { id: 'mono', name: 'モノトーン', colors: ['#FFFFFF', '#A1A1AA', '#52525B'], type: 'gradient' },
      { id: 'random', name: 'ランダム', colors: [], type: 'random' },
      { id: 'custom', name: 'カスタム', colors: ['#6366F1', '#EC4899'], type: 'custom' }
    ];

    let currentPresetId = 'rainbow';
    let customColors = ['#6366F1', '#EC4899'];
    let hexMode = 'hash';
    let chunkSize = 1;

    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const previewBox = document.getElementById('previewBox');
    const charCountBadge = document.getElementById('charCountBadge');
    const outputLengthBadge = document.getElementById('outputLengthBadge');
    const chunkDisplayBadge = document.getElementById('chunkDisplayBadge');
    const chunkSlider = document.getElementById('chunkSlider');
    const customChunkWrap = document.getElementById('customChunkWrap');
    const sliderValueText = document.getElementById('sliderValueText');
    const clearInputBtn = document.getElementById('clearInputBtn');
    const copyBtn = document.getElementById('copyBtn');
    const presetsGrid = document.getElementById('presetsGrid');
    const customColorPickerWrap = document.getElementById('customColorPickerWrap');
    const customColorInputs = document.getElementById('customColorInputs');
    const addCustomColorBtn = document.getElementById('addCustomColorBtn');
    const skipSpacesCheck = document.getElementById('skipSpacesCheck');
    const skipNewlinesCheck = document.getElementById('skipNewlinesCheck');
    const customTagName = document.getElementById('customTagName');
    const toast = document.getElementById('toast');

    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const num = parseInt(hex, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function rgbToHex(r, g, b) {
      const toHex = (n) => {
        const h = Math.max(0, Math.min(255, Math.round(n))).toString(16);
        return h.length === 1 ? '0' + h : h;
      };
      return `${toHex(r)}${toHex(g)}${toHex(b)}`;
    }

    function interpolateColor(color1, color2, factor) {
      const c1 = hexToRgb(color1);
      const c2 = hexToRgb(color2);
      const r = c1.r + factor * (c2.r - c1.r);
      const g = c1.g + factor * (c2.g - c1.g);
      const b = c1.b + factor * (c2.b - c1.b);
      return rgbToHex(r, g, b);
    }

    function getMultiStopColor(colors, factor) {
      if (!colors || colors.length === 0) return 'FFFFFF';
      if (colors.length === 1) return colors[0].replace('#', '');
      if (factor <= 0) return colors[0].replace('#', '');
      if (factor >= 1) return colors[colors.length - 1].replace('#', '');

      const segments = colors.length - 1;
      const pos = factor * segments;
      const index = Math.floor(pos);
      const subFactor = pos - index;

      return interpolateColor(colors[index], colors[index + 1], subFactor);
    }

    function getRandomColorHex() {
      const letters = '0123456789ABCDEF';
      let color = '';
      for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    function renderPresets() {
      presetsGrid.innerHTML = '';
      PRESETS.forEach(preset => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const isSelected = preset.id === currentPresetId;

        btn.className = `p-2 rounded-sm border text-left flex flex-col justify-between h-12 transition-colors ${
          isSelected
            ? 'border-zinc-900 bg-zinc-900 text-white'
            : 'border-zinc-300 bg-white text-zinc-800 hover:bg-zinc-50'
        }`;

        let bgStyle = '';
        if (preset.type === 'random') {
          bgStyle = 'background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981, #06b6d4, #6366f1);';
        } else if (preset.colors.length > 0) {
          bgStyle = `background: linear-gradient(90deg, ${preset.colors.join(', ')});`;
        } else {
          bgStyle = 'background: #cbd5e1;';
        }

        btn.innerHTML = `
          <span class="text-xs font-bold truncate">${preset.name}</span>
          <div class="w-full h-1" style="${bgStyle}"></div>
        `;

        btn.addEventListener('click', () => {
          currentPresetId = preset.id;
          renderPresets();
          updateCustomColorVisibility();
          generateTags();
        });

        presetsGrid.appendChild(btn);
      });
    }

    function renderCustomColorInputs() {
      customColorInputs.innerHTML = '';
      customColors.forEach((color, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex items-center gap-1 bg-zinc-100 border border-zinc-300 px-1.5 py-0.5 rounded-sm';

        const colorInput = document.createElement('input');
        colorInput.type = 'color';
        colorInput.value = color;
        colorInput.className = 'w-4 h-4 cursor-pointer border-0 p-0 bg-transparent';
        colorInput.addEventListener('input', (e) => {
          customColors[index] = e.target.value;
          hexText.textContent = e.target.value.toUpperCase();
          generateTags();
        });

        const hexText = document.createElement('span');
        hexText.className = 'text-[11px] font-mono text-zinc-700 uppercase';
        hexText.textContent = color;

        wrapper.appendChild(colorInput);
        wrapper.appendChild(hexText);

        if (customColors.length > 2) {
          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.className = 'text-zinc-400 hover:text-zinc-900 text-xs px-0.5';
          removeBtn.textContent = '×';
          removeBtn.addEventListener('click', () => {
            customColors.splice(index, 1);
            renderCustomColorInputs();
            generateTags();
          });
          wrapper.appendChild(removeBtn);
        }

        customColorInputs.appendChild(wrapper);
      });
    }

    function updateCustomColorVisibility() {
      if (currentPresetId === 'custom') {
        customColorPickerWrap.classList.remove('hidden');
      } else {
        customColorPickerWrap.classList.add('hidden');
      }
    }

    function generateTags() {
      const text = inputText.value;
      const chars = Array.from(text);
      const tagName = customTagName.value.trim() || '色';
      const skipSpaces = skipSpacesCheck.checked;
      const skipNewlines = skipNewlinesCheck.checked;

      charCountBadge.textContent = `${chars.length} 文字`;

      if (chars.length === 0) {
        outputText.value = '';
        previewBox.innerHTML = '<span class="text-zinc-500 text-xs font-mono">プレビュー領域</span>';
        outputLengthBadge.textContent = '0 文字';
        return;
      }

      const activePreset = PRESETS.find(p => p.id === currentPresetId) || PRESETS[0];
      const colorsList = currentPresetId === 'custom' ? customColors : activePreset.colors;

      const segments = [];
      let currentChunk = [];

      for (let i = 0; i < chars.length; i++) {
        const char = chars[i];
        const isSpace = /\s/.test(char) && char !== '\n';
        const isNewline = char === '\n';

        if (isNewline) {
          if (currentChunk.length > 0) {
            segments.push({ type: 'colored', text: currentChunk.join('') });
            currentChunk = [];
          }
          segments.push({ type: 'newline', text: '\n' });
          continue;
        }

        if (isSpace && skipSpaces) {
          if (currentChunk.length > 0) {
            segments.push({ type: 'colored', text: currentChunk.join('') });
            currentChunk = [];
          }
          segments.push({ type: 'space', text: char });
          continue;
        }

        currentChunk.push(char);
        if (currentChunk.length >= chunkSize) {
          segments.push({ type: 'colored', text: currentChunk.join('') });
          currentChunk = [];
        }
      }

      if (currentChunk.length > 0) {
        segments.push({ type: 'colored', text: currentChunk.join('') });
      }

      const coloredSegmentsCount = segments.filter(s => s.type === 'colored').length;

      let outputCode = '';
      let previewHtml = '';
      let coloredIndex = 0;

      segments.forEach(seg => {
        if (seg.type === 'newline') {
          outputCode += '\n';
          previewHtml += '<br>';
          return;
        }

        if (seg.type === 'space') {
          outputCode += seg.text;
          previewHtml += seg.text === ' ' ? '&nbsp;' : seg.text;
          return;
        }

        let rawHex = '';
        if (activePreset.type === 'random') {
          rawHex = getRandomColorHex();
        } else {
          const factor = coloredSegmentsCount <= 1 ? 0 : coloredIndex / (coloredSegmentsCount - 1);
          rawHex = getMultiStopColor(colorsList, factor);
        }
        coloredIndex++;

        let formattedHex = rawHex.toUpperCase();
        let displayColor = '#' + rawHex;
        let tagColorValue = hexMode === 'hash' ? ('#' + formattedHex) : formattedHex;

        outputCode += `<${tagName}="${tagColorValue}">${seg.text}</${tagName}>`;

        const safeText = seg.text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/ /g, '&nbsp;');

        previewHtml += `<span style="color: ${displayColor};">${safeText}</span>`;
      });

      outputText.value = outputCode;
      previewBox.innerHTML = previewHtml;
      outputLengthBadge.textContent = `${outputCode.length} 文字 (タグ含む)`;
    }

    let toastTimeout;
    function showToast(msg) {
      if (msg) toast.textContent = msg;
      toast.classList.remove('opacity-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 1800);
    }

    function copyToClipboard() {
      if (!outputText.value) return;

      outputText.select();
      let successful = false;
      try {
        successful = document.execCommand('copy');
      } catch (err) {
        successful = false;
      }

      if (successful) {
        showToast('コピーしました');
      } else {
        showToast('コピーに失敗しました');
      }
    }

    inputText.addEventListener('input', generateTags);
    skipSpacesCheck.addEventListener('change', generateTags);
    skipNewlinesCheck.addEventListener('change', generateTags);
    customTagName.addEventListener('input', generateTags);

    clearInputBtn.addEventListener('click', () => {
      inputText.value = '';
      inputText.focus();
      generateTags();
    });

    copyBtn.addEventListener('click', copyToClipboard);

    const chunkBtns = document.querySelectorAll('.chunk-btn');
    function updateChunkUI(val, isCustom = false) {
      chunkSize = Math.max(1, parseInt(val, 10) || 1);
      chunkDisplayBadge.textContent = `${chunkSize}文字`;
      sliderValueText.textContent = `${chunkSize}`;
      chunkSlider.value = chunkSize;

      chunkBtns.forEach(b => {
        b.className = 'chunk-btn py-1 border border-zinc-300 bg-white text-zinc-700 hover:bg-zinc-50 font-mono';
      });

      if (isCustom) {
        const btn = document.querySelector('.chunk-btn[data-chunk-val="custom"]');
        if (btn) btn.className = 'chunk-btn py-1 border border-zinc-900 bg-zinc-900 text-white font-mono';
        customChunkWrap.classList.remove('hidden');
        customChunkWrap.classList.add('flex');
      } else {
        const btn = document.querySelector(`.chunk-btn[data-chunk-val="${val}"]`);
        if (btn) btn.className = 'chunk-btn py-1 border border-zinc-900 bg-zinc-900 text-white font-mono';
        customChunkWrap.classList.add('hidden');
        customChunkWrap.classList.remove('flex');
      }

      generateTags();
    }

    chunkBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-chunk-val');
        if (val === 'custom') {
          updateChunkUI(chunkSlider.value, true);
        } else {
          updateChunkUI(val, false);
        }
      });
    });

    chunkSlider.addEventListener('input', (e) => {
      updateChunkUI(e.target.value, true);
    });

    document.querySelectorAll('.hex-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        hexMode = btn.getAttribute('data-hex-mode');
        document.querySelectorAll('.hex-mode-btn').forEach(b => {
          b.className = 'hex-mode-btn py-1 border border-zinc-300 bg-white text-zinc-700 hover:bg-zinc-50';
        });
        btn.className = 'hex-mode-btn py-1 border border-zinc-900 bg-zinc-900 text-white';
        generateTags();
      });
    });

    addCustomColorBtn.addEventListener('click', () => {
      if (customColors.length >= 6) return;
      customColors.push('#' + getRandomColorHex());
      renderCustomColorInputs();
      generateTags();
    });

    renderPresets();
    renderCustomColorInputs();
    updateCustomColorVisibility();
    generateTags();
  </script>
</body>
</html>
